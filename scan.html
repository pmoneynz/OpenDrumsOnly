<body class="scan-page">
    <header>
        <h1><a href="index.html">OpenDrumsOnly</a></h1>
        <div class="header-controls">
            <a href="index.html" class="header-nav-link" title="Back to gallery">Gallery</a>
            <a href="scan.html" class="icon-button" title="Scan vinyl" aria-label="Scan vinyl" aria-current="page">
                <i class="fas fa-camera" aria-hidden="true"></i>
            </a>
        </div>
    </header>

    <div class="scan-shell">
        <section class="scan-stage" aria-label="Camera viewfinder">
            <p class="scan-hint" id="scan-hint">Front, back, or center label — one clear photo is enough.</p>
            <video id="scan-video" class="scan-video" playsinline muted autoplay></video>
            <canvas id="scan-canvas" class="scan-canvas" aria-hidden="true"></canvas>
            <div class="scan-fallback-poster" id="scan-fallback" hidden>
                <p>Camera unavailable. Use the photo button to open your camera or pick an image.</p>
            </div>
            <p class="scan-status" id="scan-status" role="status" aria-live="polite"></p>

            <div class="scan-controls">
                <div class="scan-shot-types" role="group" aria-label="Optional photo type">
                    <button type="button" class="scan-shot-type" data-shot="front" aria-pressed="false">Front</button>
                    <button type="button" class="scan-shot-type" data-shot="back" aria-pressed="false">Back</button>
                    <button type="button" class="scan-shot-type" data-shot="label" aria-pressed="false">Label</button>
                </div>
                <div class="scan-shutter-row">
                    <button type="button" class="scan-side-btn" id="scan-pick-file" title="Choose photo" aria-label="Choose photo">
                        <i class="fas fa-images" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="scan-shutter" id="scan-shutter" title="Take photo" aria-label="Take photo"></button>
                    <button type="button" class="scan-side-btn" id="scan-flip" title="Switch camera" aria-label="Switch camera" disabled>
                        <i class="fas fa-camera-rotate" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <input
                type="file"
                id="scan-file"
                class="scan-file-input"
                accept="image/*"
                capture="environment"
                tabindex="-1"
                aria-hidden="true"
            >
        </section>

        <section class="scan-results" id="scan-results" aria-label="Scan results" hidden>
            <div class="scan-results-header">
                <div>
                    <h2 id="scan-results-title">Results</h2>
                    <p class="scan-results-sub" id="scan-results-sub"></p>
                </div>
                <button type="button" class="scan-close-results" id="scan-close-results" title="Close results" aria-label="Close results">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>
            <div class="scan-preview-strip" id="scan-preview-strip" hidden></div>
            <div id="scan-results-body"></div>
            <div class="scan-results-actions" id="scan-results-actions"></div>
        </section>
    </div>

    <script src="scan.js" defer></script>
</body>
</html>
